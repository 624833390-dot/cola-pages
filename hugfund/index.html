<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>抱抱许愿池</title>
<style>
:root {
  --bg: #faf7f4; --card: #fffbf8; --text: #3d3226; --sub: #9b8c7d;
  --accent: #e8856d; --gold: #c8963e;
  --shadow: 0 2px 16px rgba(60,30,10,.06); --radius: 20px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  -webkit-font-smoothing:antialiased; padding-bottom:100px;
}
.toast-bar {
  position:fixed; top:0; left:0; right:0; background:#4caf50; color:#fff;
  text-align:center; padding:12px; font-size:14px; font-weight:600;
  transform:translateY(-100%); transition:transform .3s; z-index:300;
}
.toast-bar.show { transform:translateY(0); }
.header { text-align:center; padding:36px 24px 24px; }
.header .icon { font-size:48px; animation:float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.header h1 { font-size:22px; font-weight:600; letter-spacing:.5px; margin:4px 0; }
.header .subtitle { font-size:13px; color:var(--sub); }

.balance-card {
  margin:0 20px 20px; background:var(--card); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:24px; text-align:center; position:relative; overflow:hidden;
}
.balance-card::before {
  content:''; position:absolute; top:-40px; right:-40px;
  width:120px; height:120px;
  background:radial-gradient(circle,rgba(232,133,109,.08) 0%,transparent 70%); border-radius:50%;
}
.balance-label { font-size:12px; color:var(--sub); letter-spacing:1px; margin-bottom:6px; }
.balance-amount { font-size:42px; font-weight:700; color:var(--gold); letter-spacing:-1px; position:relative; z-index:1; }
.balance-amount .unit { font-size:16px; font-weight:400; margin-left:2px; }
.balance-stats { display:flex; justify-content:center; gap:24px; margin-top:12px; font-size:12px; color:var(--sub); }
.balance-stats span strong { color:var(--text); font-weight:600; }

.share-btn-row { display:flex; justify-content:center; gap:12px; margin-top:14px; }
.btn-share {
  display:inline-flex; align-items:center; gap:5px; padding:7px 16px;
  background:#fff; border:1px solid #e8dcd0; border-radius:20px;
  font-size:12px; color:var(--sub); cursor:pointer;
  -webkit-tap-highlight-color:transparent; transition:all .15s;
}
.btn-share:active { background:#fdf0eb; border-color:var(--accent); color:var(--accent); }

.goal-bar-wrap { margin:0 20px 20px; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 20px; display:none; }
.goal-bar-label { font-size:12px; color:var(--sub); margin-bottom:8px; display:flex; justify-content:space-between; }
.goal-bar-label .goal-name { color:var(--text); font-weight:500; }
.goal-bar { height:6px; background:#f0e8e0; border-radius:3px; overflow:hidden; }
.goal-bar-fill { height:100%; background:linear-gradient(90deg,#e8856d,#c8963e); border-radius:3px; transition:width .5s ease; }

.hug-section { margin:0 20px 28px; text-align:center; }
.btn-hug {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  width:100%; max-width:320px; padding:18px 0;
  background:var(--accent); color:#fff; border:none; border-radius:50px;
  font-size:17px; font-weight:600; letter-spacing:.5px;
  box-shadow:0 4px 20px rgba(232,133,109,.3); cursor:pointer;
  transition:transform .15s,box-shadow .15s; -webkit-tap-highlight-color:transparent;
}
.btn-hug:active { transform:scale(.97); box-shadow:0 2px 12px rgba(232,133,109,.2); }
.btn-hug .emoji { font-size:22px; }
.hug-hint { font-size:12px; color:var(--sub); margin-top:10px; }

.modal-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center;
  z-index:100; opacity:0; pointer-events:none; transition:opacity .25s;
}
.modal-overlay.active { opacity:1; pointer-events:auto; }
.modal {
  background:var(--card); border-radius:var(--radius); padding:28px 24px 20px;
  width:calc(100% - 48px); max-width:340px; text-align:center;
  box-shadow:0 8px 40px rgba(0,0,0,.12);
}
.modal .m-emoji { font-size:40px; margin-bottom:8px; }
.modal .m-title { font-size:16px; font-weight:600; margin-bottom:8px; }
.modal .m-desc { font-size:13px; color:var(--sub); line-height:1.6; margin-bottom:20px; }
.modal .m-actions { display:flex; gap:8px; flex-wrap:wrap; }
.modal .m-actions button { padding:12px 10px; border-radius:50px; font-size:14px; font-weight:600; border:none; cursor:pointer; }
.modal .m-actions button:active { transform:scale(.96); }
.btn-cancel { background:#f0e8e0; color:var(--sub); flex:1; }
.btn-520 { background:var(--accent); color:#fff; flex:1.2; }
.btn-1314 { background:linear-gradient(135deg,#e8856d,#c8963e); color:#fff; flex:1.2; }

.hug-toast {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.5);
  font-size:64px; z-index:200; pointer-events:none; opacity:0;
}
.hug-toast.show { animation:toastBounce .7s ease forwards; }
@keyframes toastBounce {
  0% { opacity:1; transform:translate(-50%,-50%) scale(.5); }
  50% { opacity:1; transform:translate(-50%,-50%) scale(1.2); }
  70% { opacity:1; transform:translate(-50%,-50%) scale(.95); }
  100% { opacity:0; transform:translate(-50%,-60%) scale(1); }
}

/* Share card overlay */
.share-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
  z-index:150; opacity:0; pointer-events:none; transition:opacity .25s;
}
.share-overlay.active { opacity:1; pointer-events:auto; }
.share-card-wrap {
  background:#fff; border-radius:20px; padding:16px; max-width:340px; width:calc(100% - 40px);
  box-shadow:0 12px 48px rgba(0,0,0,.15); text-align:center;
}
.share-card-wrap canvas { width:100%; border-radius:14px; display:block; }
.share-card-actions { display:flex; gap:10px; margin-top:12px; }
.share-card-actions button { flex:1; padding:11px; border-radius:24px; font-size:14px; font-weight:600; border:none; cursor:pointer; }
.btn-save { background:var(--accent); color:#fff; }
.btn-close { background:#f0e8e0; color:var(--sub); }

.timeline-section { margin:0 20px; }
.timeline-title { font-size:14px; font-weight:600; color:var(--sub); margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.timeline-list { list-style:none; }
.timeline-item {
  background:var(--card); border-radius:14px; padding:14px 16px;
  margin-bottom:8px; box-shadow:0 1px 6px rgba(60,30,10,.03);
  display:flex; align-items:center; gap:12px;
  animation:slideIn .3s ease;
}
@keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.tl-avatar { width:40px; height:40px; border-radius:50%; background:#fdf0eb; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.tl-body { flex:1; min-width:0; }
.tl-body .tl-message { font-size:14px; line-height:1.5; }
.tl-body .tl-amount { font-size:12px; color:var(--gold); font-weight:600; margin-top:2px; }
.tl-time { font-size:11px; color:var(--sub); flex-shrink:0; }
.empty-state { text-align:center; padding:32px 0; color:var(--sub); font-size:13px; }

.sync-indicator {
  text-align:center; font-size:11px; color:var(--sub); margin-top:8px;
  display:flex; align-items:center; justify-content:center; gap:4px;
}
.sync-dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
.sync-dot.online { background:#4caf50; }
.sync-dot.offline { background:#ccc; }
.sync-dot.cloud { background:#00a4ff; animation:pulse 2s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.settings-toggle { position:fixed; bottom:20px; right:20px; width:44px; height:44px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; z-index:50; border:none; color:var(--sub); -webkit-tap-highlight-color:transparent; }
.settings-panel { position:fixed; bottom:0; left:0; width:100%; background:var(--card); border-radius:24px 24px 0 0; box-shadow:0 -4px 24px rgba(0,0,0,.08); z-index:90; padding:24px 24px 36px; transform:translateY(100%); transition:transform .3s cubic-bezier(.4,0,.2,1); }
.settings-panel.active { transform:translateY(0); }
.settings-panel h3 { font-size:16px; margin-bottom:16px; }
.settings-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid #f0e8e0; }
.settings-row label { font-size:14px; }
.settings-row input, .settings-row select { padding:8px 12px; border:1px solid #e8dcd0; border-radius:10px; font-size:14px; background:var(--bg); }
.settings-row input { width:120px; text-align:right; }
.btn-reset { width:100%; margin-top:16px; padding:12px; background:transparent; border:1px solid #e8dcd0; border-radius:14px; font-size:14px; color:var(--sub); cursor:pointer; }
.settings-hint { font-size:11px; color:var(--sub); margin-top:12px; line-height:1.5; }
</style>
</head>
<body>

<div class="toast-bar" id="toastBar"></div>

<div class="header">
  <div class="icon">🤗</div>
  <h1>抱抱许愿池</h1>
  <div class="subtitle" id="partnerLabel">给 安妮</div>
</div>

<div class="balance-card">
  <div class="balance-label">💛 心愿基金</div>
  <div class="balance-amount" id="balanceDisplay">0<span class="unit">元</span></div>
  <div class="balance-stats">
    <span>老王：<strong id="myCount">0</strong>次</span>
    <span>安妮：<strong id="taCount">0</strong>次</span>
  </div>
  <div class="share-btn-row">
    <button class="btn-share" id="btnShareCard">📤 生成分享卡片</button>
  </div>
</div>

<div class="goal-bar-wrap" id="goalBarWrap">
  <div class="goal-bar-label">
    <span>🎯 <span class="goal-name" id="goalName"></span></span>
    <span id="goalProgress"></span>
  </div>
  <div class="goal-bar"><div class="goal-bar-fill" id="goalFill" style="width:0%"></div></div>
</div>

<div class="hug-section">
  <button class="btn-hug" id="btnHug">
    <span class="emoji">🤗</span> 感觉 TA 不开心
  </button>
  <div class="hug-hint">按一下 · 选 ¥520 或 ¥1314 · TA收到抱抱</div>
</div>

<div class="sync-indicator">
  <span class="sync-dot offline" id="syncDot"></span>
  <span id="syncLabel">等待同步…</span>
</div>

<div class="timeline-section">
  <div class="timeline-title">📖 我们的抱抱</div>
  <ul class="timeline-list" id="timelineList"></ul>
  <div class="empty-state" id="emptyState">还没有抱抱。按一下上面的按钮，送出第一个。</div>
</div>

<!-- Hug confirm modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="m-emoji">🤗</div>
    <div class="m-title">感觉 <span id="modalTaName">安妮</span> 不开心？</div>
    <div class="m-desc">往心愿基金存入一笔，同时给 TA 一个抱抱</div>
    <div class="m-actions">
      <button class="btn-cancel" id="btnCancel">再想想</button>
      <button class="btn-confirm btn-520" data-amount="520">¥520 🤗</button>
      <button class="btn-confirm btn-1314" data-amount="1314">¥1314 ❤️</button>
    </div>
  </div>
</div>

<!-- Share card overlay -->
<div class="share-overlay" id="shareOverlay">
  <div class="share-card-wrap">
    <canvas id="shareCanvas" width="600" height="900"></canvas>
    <div class="share-card-actions">
      <button class="btn-close" id="btnCloseShare">关闭</button>
      <button class="btn-save" id="btnSaveShare">保存图片</button>
    </div>
  </div>
</div>

<div class="hug-toast" id="hugToast">🤗</div>

<button class="settings-toggle" id="btnSettings">⚙️</button>
<div class="settings-panel" id="settingsPanel">
  <h3>设置</h3>
  <div class="settings-row"><label>我是谁</label><select id="inputWhoAmI"><option value="老王">老王</option><option value="安妮">安妮</option></select></div>
  <div class="settings-row"><label>TA 的名字</label><input type="text" id="inputPartnerName" value="安妮"></div>
  <div class="settings-row"><label>我的名字</label><input type="text" id="inputMyName" value="老王"></div>
  <div class="settings-row"><label>心愿目标</label><input type="text" id="inputGoal" placeholder="比如：去大理"></div>
  <div class="settings-row"><label>目标金额</label><input type="number" id="inputGoalAmount" value="10000"></div>
  <button class="btn-reset" id="btnReset">重置所有数据</button>
  <div class="settings-hint" id="syncHelp">数据保存在本地 + CloudBase 实时同步。<br>两人打开页面后，抱抱记录自动同步。</div>
</div>

<!-- CloudBase SDK -->
<script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.8.1/cloudbase.full.js"></script>

<script>
const $ = id => document.getElementById(id);
const STORAGE_KEY = 'hugfund_v2';

// ========== CloudBase config ==========
const CB_ENV_ID = 'hugfund-d6gawu444222c10c1';
const PAGE_URL = 'https://624833390-dot.github.io/cola-pages/hugfund/';
let cloudbase, db, cloudReady = false;

// ========== Defaults ==========
const defaults = {
  balance: 0, myHugs: 0, taHugs: 0,
  goal: '', goalAmount: 10000,
  partnerName: '安妮', myName: '老王', whoAmI: '老王',
  timeline: []
};

// ========== Data layer ==========
let data = loadLocal();

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...defaults, ...JSON.parse(raw) };
  } catch(e) {}
  return { ...defaults };
}
function saveLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

// ========== CloudBase init ==========
async function initCloudBase() {
  // Wait for SDK to load
  let retries = 0;
  while (!window.cloudbase && retries < 30) {
    await new Promise(r => setTimeout(r, 500));
    retries++;
  }
  if (!window.cloudbase) {
    setSyncState('offline', 'CloudBase SDK 加载失败，检查网络');
    return false;
  }

  try {
    cloudbase = window.cloudbase.init({ env: CB_ENV_ID });
    
    // Try anonymous login
    const auth = cloudbase.auth({ persistence: 'local' });
    let loginRes;
    try {
      loginRes = await auth.anonymousAuthProvider().signIn();
    } catch(e1) {
      // Fallback: try newer API
      try {
        loginRes = await auth.signInAnonymously();
      } catch(e2) {
        setSyncState('offline', 'CloudBase 登录失败：请在控制台开启匿名登录');
        return false;
      }
    }
    
    db = cloudbase.database();
    cloudReady = true;

    // Try to pull initial state (create doc if missing)
    await pullFromCloud();

    // Set up watch for real-time (with polling fallback)
    try {
      const watcher = db.collection('hugfund').doc('shared');
      if (typeof watcher.watch === 'function') {
        watcher.watch({
          onChange(snapshot) {
            if (snapshot.docs && snapshot.docs.length > 0) {
              mergeServerData(snapshot.docs[0]);
            }
          },
          onError(e) { /* silent */ }
        });
      }
    } catch(e) { /* watch not supported, use polling */ }

    // Polling fallback every 2 seconds (works even without watch)
    setInterval(async () => {
      if (cloudReady) await pullFromCloud();
    }, 2000);

    setSyncState('cloud', 'CloudBase 实时同步中');
    return true;
  } catch(e) {
    setSyncState('offline', 'CloudBase 连接失败：' + (e.message || e).toString().slice(0, 40));
    return false;
  }
}

async function pullFromCloud() {
  if (!cloudReady) return;
  try {
    const res = await db.collection('hugfund').doc('shared').get();
    if (res.data && res.data.length > 0 && res.data[0]) {
      mergeServerData(res.data[0]);
    }
  } catch(e) {
    // Document might not exist — create it from local data
    if (String(e).includes('not found') || String(e).includes('not exist')) {
      await pushToCloud();
    }
  }
}

function mergeServerData(srv) {
  if (!srv || typeof srv !== 'object') return;
  let changed = false;
  // Use server balance if it's higher (both sides accumulate)
  if (typeof srv.balance === 'number' && srv.balance >= (data.balance || 0)) { data.balance = srv.balance; changed = true; }
  // Use server hug counts if they exist and are >= local
  if (typeof srv.myHugs === 'number' && srv.myHugs >= (data.myHugs || 0)) { data.myHugs = srv.myHugs; changed = true; }
  if (typeof srv.taHugs === 'number' && srv.taHugs >= (data.taHugs || 0)) { data.taHugs = srv.taHugs; changed = true; }
  // Server timeline is authoritative (merge, dedupe by id)
  if (Array.isArray(srv.timeline)) {
    const ids = new Set(data.timeline.map(e => e.id));
    for (const e of srv.timeline) {
      if (!ids.has(e.id)) { data.timeline.push(e); ids.add(e.id); }
    }
    changed = true;
  }
  if (srv.goal && srv.goal !== data.goal) { data.goal = srv.goal; changed = true; }
  if (srv.goalAmount && srv.goalAmount !== data.goalAmount) { data.goalAmount = srv.goalAmount; changed = true; }
  if (srv.partnerName) { data.partnerName = srv.partnerName; changed = true; }
  if (srv.myName) { data.myName = srv.myName; changed = true; }
  if (changed) { saveLocal(); render(); }
}

async function pushToCloud() {
  if (!cloudReady) return;
  try {
    await db.collection('hugfund').doc('shared').set({
      balance: data.balance,
      myHugs: data.myHugs,
      taHugs: data.taHugs,
      timeline: data.timeline,
      goal: data.goal,
      goalAmount: data.goalAmount,
      partnerName: data.partnerName,
      myName: data.myName,
      _ts: Date.now()
    });
  } catch(e) {
    // If set fails, try add (doc might not exist)
    try {
      await db.collection('hugfund').add({
        _id: 'shared',
        balance: data.balance,
        myHugs: data.myHugs,
        taHugs: data.taHugs,
        timeline: data.timeline,
        goal: data.goal,
        goalAmount: data.goalAmount,
        partnerName: data.partnerName,
        myName: data.myName,
        _ts: Date.now()
      });
    } catch(e2) {
      // Silently fail — data is still in localStorage
    }
  }
}

// ========== Render ==========
function render() {
  const d = data;
  $('partnerLabel').textContent = '给 ' + (d.partnerName || '安妮');
  $('balanceDisplay').innerHTML = (d.balance||0).toLocaleString() + '<span class="unit">元</span>';
  $('myCount').textContent = d.myHugs || 0;
  $('taCount').textContent = d.taHugs || 0;

  if (d.goal) {
    $('goalBarWrap').style.display = 'block';
    $('goalName').textContent = d.goal;
    const pct = Math.min(100, Math.round((d.balance||0) / (d.goalAmount||10000) * 100));
    $('goalProgress').textContent = (d.balance||0).toLocaleString() + ' / ' + (d.goalAmount||10000).toLocaleString();
    $('goalFill').style.width = pct + '%';
  } else {
    $('goalBarWrap').style.display = 'none';
  }

  const tl = d.timeline || [];
  $('timelineList').innerHTML = '';
  if (!tl.length) {
    $('emptyState').style.display = 'block';
  } else {
    $('emptyState').style.display = 'none';
    [...tl].reverse().forEach(item => {
      const li = document.createElement('li');
      li.className = 'timeline-item';
      const t = item.time ? new Date(item.time.replace(' ','T')) : new Date();
      li.innerHTML = `
        <div class="tl-avatar">${item.emoji||'🤗'}</div>
        <div class="tl-body">
          <div class="tl-message">${esc(item.message||'')}</div>
          <div class="tl-amount">+¥${(item.amount||520).toLocaleString()} · 余额 ¥${(item.balanceAfter||0).toLocaleString()}</div>
        </div>
        <div class="tl-time">${pad(t.getMonth()+1)}/${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}</div>`;
      $('timelineList').appendChild(li);
    });
  }

  $('modalTaName').textContent = d.partnerName || '安妮';
  $('inputPartnerName').value = d.partnerName || '安妮';
  $('inputMyName').value = d.myName || '老王';
  $('inputGoal').value = d.goal || '';
  $('inputGoalAmount').value = d.goalAmount || 10000;
  $('inputWhoAmI').value = d.whoAmI || '老王';
}

function pad(n) { return String(n).padStart(2,'0'); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setSyncState(cls, label) {
  $('syncDot').className = 'sync-dot ' + cls;
  $('syncLabel').textContent = label;
}

// ========== Hug ==========
function doHug(amount) {
  amount = amount || 520;
  const now = new Date().toISOString();
  const emoji = amount === 1314 ? '❤️' : '🤗';
  const msg = data.whoAmI + ' 感觉 ' + data.partnerName + ' 不太开心，给了一个抱抱';
  data.balance += amount;
  if (data.whoAmI === '老王') data.myHugs++; else data.taHugs++;
  const entry = {
    id: Math.random().toString(36).slice(2,10),
    time: now, message: msg, from: data.whoAmI, emoji: emoji,
    amount: amount, balanceAfter: data.balance
  };
  data.timeline.push(entry);
  saveLocal();
  pushToCloud();
  render();
}

let toastTimer;
function showToast(emoji) {
  $('hugToast').textContent = emoji||'🤗';
  $('hugToast').classList.remove('show');
  void $('hugToast').offsetWidth;
  $('hugToast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('hugToast').classList.remove('show'), 800);
}
function notifyMe(msg) {
  if (Notification.permission === 'granted') {
    new Notification('🤗 抱抱许愿池', { body: msg });
  }
  $('toastBar').textContent = msg;
  $('toastBar').classList.add('show');
  setTimeout(() => $('toastBar').classList.remove('show'), 4000);
}

// ========== Share card (方案 D) ==========
let qrImage = null;

function loadQRCode() {
  // Generate QR via API, cache as Image
  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(PAGE_URL);
  qrImage = new Image();
  qrImage.crossOrigin = 'anonymous';
  qrImage.src = qrUrl;
}

function drawShareCard() {
  const canvas = $('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = 600, H = 900;

  // Background — warm gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#fffbf8');
  bg.addColorStop(0.5, '#fdf5f0');
  bg.addColorStop(1, '#faf7f4');
  ctx.fillStyle = bg;
  roundRect(ctx, 0, 0, W, H, 24);
  ctx.fill();

  // Decorative circles
  ctx.fillStyle = 'rgba(232,133,109,0.06)';
  ctx.beginPath(); ctx.arc(480, 100, 160, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(200,150,62,0.05)';
  ctx.beginPath(); ctx.arc(120, 750, 180, 0, Math.PI*2); ctx.fill();

  // Title
  ctx.fillStyle = '#3d3226';
  ctx.font = 'bold 36px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🤗 抱抱许愿池', W/2, 80);

  // Subtitle
  ctx.fillStyle = '#9b8c7d';
  ctx.font = '18px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('老王 & 安妮', W/2, 115);

  // Divider
  ctx.strokeStyle = '#e8dcd0';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(60, 140); ctx.lineTo(W-60, 140); ctx.stroke();

  // Balance
  ctx.fillStyle = '#c8963e';
  ctx.font = 'bold 56px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('¥ ' + (data.balance||0).toLocaleString(), W/2, 210);

  ctx.fillStyle = '#9b8c7d';
  ctx.font = '15px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('心愿基金', W/2, 238);

  // Hug counts
  const countY = 280;
  // Left — 老王
  ctx.fillStyle = '#fdf0eb';
  roundRect(ctx, 80, countY, 200, 80, 16);
  ctx.fill();
  ctx.fillStyle = '#e8856d';
  ctx.font = 'bold 32px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText((data.myHugs||0) + ' 次', 180, countY + 48);
  ctx.fillStyle = '#9b8c7d';
  ctx.font = '14px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('老王送出', 180, countY + 70);

  // Right — 安妮
  ctx.fillStyle = '#fdf0eb';
  roundRect(ctx, 320, countY, 200, 80, 16);
  ctx.fill();
  ctx.fillStyle = '#e8856d';
  ctx.font = 'bold 32px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText((data.taHugs||0) + ' 次', 420, countY + 48);
  ctx.fillStyle = '#9b8c7d';
  ctx.font = '14px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('安妮送出', 420, countY + 70);

  // Goal progress
  if (data.goal) {
    const goalY = 400;
    ctx.fillStyle = '#3d3226';
    ctx.font = 'bold 18px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText('🎯 ' + data.goal, W/2, goalY);

    const pct = Math.min(100, Math.round((data.balance||0) / (data.goalAmount||10000) * 100));
    const barX = 80, barW = 440, barH = 12, barY = goalY + 24;
    ctx.fillStyle = '#f0e8e0';
    roundRect(ctx, barX, barY, barW, barH, 6);
    ctx.fill();
    const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    grad.addColorStop(0, '#e8856d');
    grad.addColorStop(1, '#c8963e');
    ctx.fillStyle = grad;
    roundRect(ctx, barX, barY, barW * pct / 100, barH, 6);
    ctx.fill();

    ctx.fillStyle = '#9b8c7d';
    ctx.font = '13px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText((data.balance||0).toLocaleString() + ' / ' + (data.goalAmount||10000).toLocaleString() + '  (' + pct + '%)', W/2, barY + 36);
  }

  // Recent timeline (last 3)
  const tlY = data.goal ? 500 : 420;
  ctx.fillStyle = '#3d3226';
  ctx.font = 'bold 16px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('最近抱抱', W/2, tlY);

  const recentTl = [...(data.timeline||[])].reverse().slice(0, 3);
  recentTl.forEach((item, i) => {
    const y = tlY + 30 + i * 40;
    ctx.fillStyle = '#fdf0eb';
    roundRect(ctx, 60, y, 480, 34, 12);
    ctx.fill();
    ctx.fillStyle = '#3d3226';
    ctx.font = '14px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'left';
    const shortMsg = item.from + ' → ' + (item.balanceAfter||'').toLocaleString() + '元';
    ctx.fillText(shortMsg, 80, y + 23);
  });
  ctx.textAlign = 'center';

  // QR code
  const qrY = tlY + 180;
  ctx.fillStyle = '#9b8c7d';
  ctx.font = '13px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('扫码加入我们的抱抱许愿池', W/2, qrY);

  if (qrImage && qrImage.complete) {
    ctx.drawImage(qrImage, W/2 - 60, qrY + 10, 120, 120);
  } else {
    // Placeholder
    ctx.fillStyle = '#f0e8e0';
    ctx.fillRect(W/2 - 50, qrY + 10, 100, 100);
    ctx.fillStyle = '#9b8c7d';
    ctx.font = '11px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText('QR', W/2, qrY + 65);
  }

  // Footer
  ctx.fillStyle = '#ccc';
  ctx.font = '11px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('抱抱许愿池 · 每一份心意都算数', W/2, H - 24);

  // Wait for QR to load, then redraw
  if (qrImage && !qrImage.complete) {
    qrImage.onload = () => drawShareCard();
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function openShareCard() {
  drawShareCard();
  $('shareOverlay').classList.add('active');
}

function saveShareCard() {
  const canvas = $('shareCanvas');
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '抱抱许愿池.png';
    a.click();
    URL.revokeObjectURL(url);
    $('toastBar').textContent = '✅ 图片已保存，去微信发给 TA 吧';
    $('toastBar').classList.add('show');
    setTimeout(() => $('toastBar').classList.remove('show'), 3000);
  }, 'image/png');
}

// ========== Events ==========
$('btnHug').addEventListener('click', () => $('modalOverlay').classList.add('active'));
$('btnCancel').addEventListener('click', () => $('modalOverlay').classList.remove('active'));
$('modalOverlay').addEventListener('click', e => { if(e.target===$('modalOverlay')) $('modalOverlay').classList.remove('active'); });
// Two amount buttons
document.querySelectorAll('[data-amount]').forEach(btn => {
  btn.addEventListener('click', function() {
    const amount = parseInt(this.dataset.amount);
    $('modalOverlay').classList.remove('active');
    setTimeout(() => { doHug(amount); showToast(amount === 1314 ? '❤️' : '🤗'); }, 200);
  });
});

// Share card
$('btnShareCard').addEventListener('click', openShareCard);
$('btnCloseShare').addEventListener('click', () => $('shareOverlay').classList.remove('active'));
$('shareOverlay').addEventListener('click', e => { if(e.target===$('shareOverlay')) $('shareOverlay').classList.remove('active'); });
$('btnSaveShare').addEventListener('click', saveShareCard);

// Settings
$('btnSettings').addEventListener('click', () => {
  $('settingsPanel').classList.toggle('active');
});
document.addEventListener('click', (e) => {
  if (!$('settingsPanel').contains(e.target) && e.target !== $('btnSettings')) {
    $('settingsPanel').classList.remove('active');
  }
});
$('inputWhoAmI').addEventListener('change', function() {
  data.whoAmI = this.value; saveLocal(); pushToCloud(); render();
});
['inputPartnerName','inputMyName','inputGoal','inputGoalAmount'].forEach(id => {
  $(id).addEventListener('change', () => {
    data.partnerName = $('inputPartnerName').value.trim()||'安妮';
    data.myName = $('inputMyName').value.trim()||'老王';
    data.goal = $('inputGoal').value.trim();
    data.goalAmount = parseInt($('inputGoalAmount').value)||10000;
    saveLocal(); pushToCloud(); render();
  });
});
$('btnReset').addEventListener('click', () => {
  if (confirm('确定要清空所有数据吗？')) {
    data = { ...defaults, whoAmI: data.whoAmI };
    saveLocal(); pushToCloud(); render();
    $('settingsPanel').classList.remove('active');
  }
});

// ========== Init ==========
(async function() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  loadQRCode();
  
  const cloudOk = await initCloudBase();
  if (!cloudOk) {
    // CloudBase failed — the sync label already shows why
    // Don't try old server, don't overwrite the error message
  }
  render();
})();

function connectSSE(svr) {
  const es = new EventSource(svr + '/api/sse');
  es.onopen = () => setSyncState('online', '实时同步中');
  es.addEventListener('state', (e) => {
    try {
      mergeServerData(JSON.parse(e.data));
    } catch(ex) {}
  });
  es.addEventListener('hug', (e) => {
    try {
      const hug = JSON.parse(e.data);
      if (hug.from !== data.whoAmI) {
        showToast('🤗');
        notifyMe(hug.message);
      }
    } catch(ex) {}
  });
  es.onerror = () => setSyncState('offline', '连接断开 · 数据已保存在本地');
}
